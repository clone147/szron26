[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/szkolenie-context7"
  to = "/akademia"
  status = 301

# ── 301: stare aliasy URL ze szron.tech (zgodność z dotychczasowym routingiem) ──
[[redirects]]
  from = "/about"
  to = "/o-nas"
  status = 301
[[redirects]]
  from = "/services"
  to = "/doradztwo-technologiczne"
  status = 301
[[redirects]]
  from = "/uslugi"
  to = "/doradztwo-technologiczne"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/kontakt"
  status = 301
[[redirects]]
  from = "/benefits"
  to = "/coaching-sprint"
  status = 301
[[redirects]]
  from = "/ai-transformation"
  to = "/transformacja-ai"
  status = 301
[[redirects]]
  from = "/studia-przypadkow"
  to = "/case-studies"
  status = 301
[[redirects]]
  from = "/szkolenia"
  to = "/claude-code"
  status = 301
[[redirects]]
  from = "/augmentacja-programistow"
  to = "/coaching-sprint"
  status = 301

# ── 301: konsolidacja treści (audyt 08.2026) — 4 strony scalone/zlikwidowane ──
[[redirects]]
  from = "/wdrozenia-ai"
  to = "/coaching-sprint"
  status = 301
[[redirects]]
  from = "/augmentacja-pracownikow"
  to = "/coaching-sprint"
  status = 301
[[redirects]]
  from = "/mobile-apps"
  to = "/coaching-sprint"
  status = 301
[[redirects]]
  from = "/dla-zespolow"
  to = "/ai-dla-dev-teamow"
  status = 301

# Bezpieczeństwo + cache statyków
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# obrazy i skrypty NIE mają hasha w nazwie i bywają podmieniane pod tym samym URL-em —
# przeglądarka może ich używać z cache, ale musi rewalidować (ETag → tanie 304)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# bundle Astro/Vite — nazwy z hashem treści, bezpieczne do cache'owania na rok
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# fonty self-hosted — pliki wersjonowane w nazwie (v4/v22), efektywnie niezmienne
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
