# Codzienny skan sygnałów CAIO (JustJoin.it / NoFluffJobs / Google News)
# → Supabase Edge Function caio-ingest (upsert po URL, duplikaty bezpieczne).
# Zastępuje routine Claude Code (sandbox chmurowy nie miał egressu do skanowanych stron).
name: CAIO scan
on:
  schedule:
    - cron: '33 4 * * *' # 6:33 czasu PL (lato)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skan sygnałów
        env:
          CAIO_INGEST_SECRET: ${{ secrets.CAIO_INGEST_SECRET }}
        run: node scripts/caio/scan.mjs
