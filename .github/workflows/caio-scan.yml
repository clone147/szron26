# Codzienna rutyna CAIO: skan sygnałów → kwalifikacja odkrytych firm (LLM z web search)
# → poranny digest e-mail (Resend przez EF caio-agent). Digest idzie ZAWSZE (if: always())
# i raportuje awarie poprzednich kroków — brak maila rano = sygnał, że coś padło.
# Zastępuje routine Claude Code (sandbox chmurowy nie miał egressu do skanowanych stron).
name: CAIO scan
on:
  schedule:
    - cron: '33 4 * * *' # 6:33 czasu PL (lato)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skan sygnałów
        env:
          CAIO_INGEST_SECRET: ${{ secrets.CAIO_INGEST_SECRET }}
        run: node scripts/caio/scan.mjs

  qualify:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      info: ${{ steps.q.outputs.info }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Zainstaluj Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Kwalifikacja odkrytych firm (Claude Code headless, subskrypcja)
        id: q
        env:
          CAIO_INGEST_SECRET: ${{ secrets.CAIO_INGEST_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/caio/qualify.mjs --limit 8

  kontakty:
    needs: qualify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      info: ${{ steps.e.outputs.info }}
      credits: ${{ steps.e.outputs.credits }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: E-maile decydentów (Prospeo)
        id: e
        env:
          CAIO_INGEST_SECRET: ${{ secrets.CAIO_INGEST_SECRET }}
          PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
        run: node scripts/caio/enrich.mjs --limit 8

  digest:
    needs: [scan, qualify, kontakty]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Poranny digest
        env:
          CAIO_INGEST_SECRET: ${{ secrets.CAIO_INGEST_SECRET }}
          SCAN_RESULT: ${{ needs.scan.result }}
          QUALIFY_RESULT: ${{ needs.qualify.result }}
          QUALIFY_INFO: ${{ needs.qualify.outputs.info }}
          KONTAKTY_RESULT: ${{ needs.kontakty.result }}
          KONTAKTY_INFO: ${{ needs.kontakty.outputs.info }}
          PROSPEO_CREDITS: ${{ needs.kontakty.outputs.credits }}
        run: node scripts/caio/digest.mjs
